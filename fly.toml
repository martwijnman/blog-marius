# Fly.io: draait Dockerfile (de variant met entrypoint), met een volume voor de
# dingen die een deploy moeten overleven.
#
# Eenmalig, in deze map (bewust zonder `fly launch`: die herschrijft dit
# bestand en voegt eigen aannames toe):
#
#   fly auth login
#   fly apps create blog-marius
#   fly volumes create blog_data --size 1 --region ams --app blog-marius
#   fly secrets set APP_KEY="base64:..." --app blog-marius
#   fly deploy
#
# De APP_KEY is dezelfde als regel 3 van je lokale .env. Zet hem echt, anders
# word je bij elke deploy uitgelogd.

app = "blog-marius"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"

  # Database en storage staan op het volume, niet in de image.
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/mnt/data/database/database.sqlite"
  APP_STORAGE_PATH = "/mnt/data/storage"

  SESSION_DRIVER = "database"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "sync"

[[mounts]]
  source = "blog_data"
  destination = "/mnt/data"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Eén machine: SQLite is één bestand op één volume en verdraagt geen
  # tweede container die er tegelijk in schrijft. Dat was precies het
  # probleem op Vercel.
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
